id: execute_any_sql
name: Execute Any SQL Command
version: 1.0.0
author: DBClaw
category: admin
description: Execute ANY SQL command including DDL, DML, DCL operations. WARNING - This can modify database structure, data, and permissions. Use with extreme caution.
tags: [sql, admin, ddl, dml, dcl, insert, update, delete, drop, create, alter, grant, dangerous]

parameters:
  - name: datasource_id
    type: integer
    required: true
    description: The datasource ID
  - name: sql
    type: string
    required: true
    description: The SQL command to execute (any valid SQL statement)

permissions:
  - execute_any_sql
  - admin

code: |
  async def execute(context, params):
      datasource_id = params['datasource_id']
      sql = params['sql'].strip()

      # Log the dangerous operation
      import logging
      logger = logging.getLogger(__name__)
      logger.warning(f"DANGEROUS OPERATION: Executing unrestricted SQL on datasource {datasource_id}: {sql[:100]}")

      # Execute without restrictions
      result = await context.execute_query(sql, datasource_id, allow_write=True)

      return result

i18n:
  zh-CN:
    name: 执行任意 SQL 命令
    description: 执行“执行任意 SQL 命令”操作，返回用于诊断和运维分析的结构化结果。
    parameter_descriptions:
      datasource_id: 数据源 ID。
      sql: SQL 语句。
    permission_descriptions:
      execute_any_sql: 高风险：允许执行任意 SQL
      admin: 需要管理员权限
  en-US:
    name: Execute Any SQL Command
    description: Execute ANY SQL command including DDL, DML, DCL operations. WARNING - This can modify database structure, data, and permissions. Use with extreme caution.
    parameter_descriptions:
      datasource_id: The datasource ID
      sql: The SQL command to execute (any valid SQL statement)
    permission_descriptions:
      execute_any_sql: 'High risk: execute unrestricted SQL'
      admin: Administrator privileges required

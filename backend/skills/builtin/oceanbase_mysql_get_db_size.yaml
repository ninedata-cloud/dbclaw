id: oceanbase_mysql_get_db_size
name: OceanBase MySQL Database Size
version: 1.0.0
author: DBClaw
category: OceanBase MySQL
description: Get OceanBase MySQL database size information grouped by schema
tags: [oceanbase, oceanbase-mysql, oceanbase_mysql, db-size, capacity]

parameters:
  - name: datasource_id
    type: integer
    required: true
    description: The OceanBase MySQL datasource ID

permissions:
  - execute_query

code: |
  async def execute(context, params):
      datasource_id = params['datasource_id']
      query = (
          "SELECT table_schema, "
          "SUM(data_length + index_length) AS total_size, "
          "SUM(data_length) AS data_size, "
          "SUM(index_length) AS index_size "
          "FROM information_schema.tables "
          "WHERE table_schema NOT IN ('information_schema', 'mysql', 'performance_schema', 'sys', 'oceanbase') "
          "GROUP BY table_schema "
          "ORDER BY total_size DESC"
      )
      result = await context.execute_query(query, datasource_id)
      if not result.get("success"):
          return {"success": False, "error": result.get("error", "Failed to get database size")}
      return {"success": True, "databases": result.get("data", []), "columns": result.get("columns", [])}


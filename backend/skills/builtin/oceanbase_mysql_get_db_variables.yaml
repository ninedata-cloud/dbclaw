id: oceanbase_mysql_get_db_variables
name: OceanBase MySQL Variables
version: 1.0.0
author: DBClaw
category: OceanBase MySQL
description: Get OceanBase MySQL tenant variables and parameters
tags: [oceanbase, oceanbase-mysql, oceanbase_mysql, variables, configuration]

parameters:
  - name: datasource_id
    type: integer
    required: true
    description: The OceanBase MySQL datasource ID

permissions:
  - execute_query

code: |
  async def execute(context, params):
      datasource_id = params['datasource_id']
      result = await context.execute_query("SHOW GLOBAL VARIABLES", datasource_id)
      if not result.get("success"):
          return {"success": False, "error": result.get("error", "Failed to get variables")}
      variables = {}
      for row in result.get("data", []):
          if len(row) >= 2:
              variables[str(row[0])] = row[1]
      return {"success": True, "variables": variables}

i18n:
  zh-CN:
    name: OceanBase MySQL 数据库参数
    description: 执行“OceanBase MySQL 数据库参数”操作，返回用于诊断和运维分析的结构化结果。
    parameter_descriptions:
      datasource_id: 数据源 ID。
    permission_descriptions:
      execute_query: 允许执行受控数据库查询
  en-US:
    name: OceanBase MySQL Variables
    description: Get OceanBase MySQL tenant variables and parameters
    parameter_descriptions:
      datasource_id: The OceanBase MySQL datasource ID
    permission_descriptions:
      execute_query: Execute governed database queries

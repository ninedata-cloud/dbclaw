id: pg_list_connections
name: PostgreSQL Active Connections
version: 1.0.1
author: DBClaw
category: postgresql
description: List all active database connections with their current state and queries
tags: [postgresql, connections, monitoring]

parameters:
  - name: datasource_id
    type: integer
    required: true
    description: The database connection ID

permissions:
  - execute_query

code: |
  async def execute(context, params):
      datasource_id = params['datasource_id']

      # Read the view as JSON so optional columns are resolved at runtime.
      # Greenplum/PostgreSQL 9.4 has `waiting` but no wait_event columns.
      query = """
      WITH activities AS (
          SELECT row_to_json(a) AS item
          FROM pg_stat_activity AS a
      )
      SELECT
          COALESCE(item->>'pid', item->>'procpid')::integer AS pid,
          item->>'usename' AS username,
          item->>'application_name' AS application_name,
          item->>'client_addr' AS client_addr,
          (item->>'client_port')::integer AS client_port,
          (item->>'backend_start')::timestamptz AS backend_start,
          item->>'state' AS state,
          (item->>'state_change')::timestamptz AS state_change,
          COALESCE(
              item->>'wait_event_type',
              CASE WHEN COALESCE((item->>'waiting')::boolean, false) THEN 'Lock' END
          ) AS wait_event_type,
          COALESCE(
              item->>'wait_event',
              CASE WHEN COALESCE((item->>'waiting')::boolean, false) THEN 'Lock' END
          ) AS wait_event,
          (item->>'query_start')::timestamptz AS query_start,
          LEFT(COALESCE(item->>'query', item->>'current_query'), 100) AS query_preview
      FROM activities
      WHERE COALESCE(item->>'pid', item->>'procpid')::integer <> pg_backend_pid()
      ORDER BY (item->>'backend_start')::timestamptz DESC
      """

      result = await context.execute_query(query, datasource_id)

      if not result.get("success"):
          return {"success": False, "error": result.get("error", "Failed to list connections")}

      return {
          "success": True,
          "connections": result.get("data", []),
          "columns": result.get("columns", [])
      }


id: oceanbase_mysql_get_db_status
name: OceanBase MySQL Database Status
version: 1.0.0
author: DBClaw
category: OceanBase MySQL
description: Get current OceanBase MySQL tenant status metrics including connections, throughput, cache hit rates, and key performance indicators
tags: [oceanbase, oceanbase-mysql, oceanbase_mysql, status, performance, monitoring]

parameters:
  - name: datasource_id
    type: integer
    required: true
    description: The OceanBase MySQL datasource ID

permissions:
  - execute_query

code: |
  async def execute(context, params):
      datasource_id = params['datasource_id']

      status_result = await context.execute_query("SHOW GLOBAL STATUS", datasource_id)
      if not status_result.get("success"):
          return {"success": False, "error": status_result.get("error", "Failed to get OceanBase MySQL status")}

      status_dict = {}
      for row in status_result.get("data", []):
          if len(row) >= 2:
              status_dict[str(row[0])] = row[1]

      process_result = await context.execute_query(
          "SELECT COUNT(*) AS total, SUM(CASE WHEN COMMAND != 'Sleep' THEN 1 ELSE 0 END) AS active FROM information_schema.PROCESSLIST",
          datasource_id,
      )
      process_total = 0
      process_active = 0
      if process_result.get("success") and process_result.get("data"):
          row = process_result["data"][0]
          process_total = row[0] or 0
          process_active = row[1] or 0

      variables_result = await context.execute_query("SHOW GLOBAL VARIABLES LIKE 'max_connections'", datasource_id)
      max_connections = 0
      if variables_result.get("success") and variables_result.get("data"):
          row = variables_result["data"][0]
          if len(row) >= 2:
              max_connections = row[1] or 0

      def as_int(value):
          try:
              return int(value or 0)
          except:
              return 0

      reads = as_int(status_dict.get("Innodb_buffer_pool_reads"))
      read_requests = as_int(status_dict.get("Innodb_buffer_pool_read_requests"))
      hit_rate = 100.0
      if read_requests > 0:
          hit_rate = round(((read_requests - reads) / read_requests) * 100, 2)

      metrics = {
          "connections_total": as_int(status_dict.get("Threads_connected")) or as_int(process_total),
          "connections_active": as_int(status_dict.get("Threads_running")) or as_int(process_active),
          "max_connections": as_int(max_connections),
          "questions": as_int(status_dict.get("Questions")),
          "slow_queries": as_int(status_dict.get("Slow_queries")),
          "uptime": as_int(status_dict.get("Uptime")),
          "cache_hit_rate": hit_rate,
          "bytes_received": as_int(status_dict.get("Bytes_received")),
          "bytes_sent": as_int(status_dict.get("Bytes_sent")),
      }

      return {"success": True, "metrics": metrics, "raw_status": status_dict}

id: mysql_get_replication_status
name: MySQL Replication Status
version: 1.0.0
author: DBClaw
category: mysql
description: Get MySQL database replication/cluster status
tags: [mysql, replication, cluster, high-availability]

parameters:
  - name: datasource_id
    type: integer
    required: true
    description: The database connection ID

permissions:
  - execute_query

code: |
  async def execute(context, params):
      datasource_id = params['datasource_id']

      # Try to get slave status
      slave_result = await context.execute_query("SHOW SLAVE STATUS", datasource_id)

      # Try to get master status
      master_result = await context.execute_query("SHOW MASTER STATUS", datasource_id)

      return {
          "success": True,
          "slave_status": {
              "success": slave_result.get("success", False),
              "data": slave_result.get("data", []),
              "columns": slave_result.get("columns", [])
          },
          "master_status": {
              "success": master_result.get("success", False),
              "data": master_result.get("data", []),
              "columns": master_result.get("columns", [])
          }
      }

i18n:
  zh-CN:
    name: MySQL 复制状态
    description: 执行“MySQL 复制状态”操作，返回用于诊断和运维分析的结构化结果。
    parameter_descriptions:
      datasource_id: 数据源 ID。
    permission_descriptions:
      execute_query: 允许执行受控数据库查询
  en-US:
    name: MySQL Replication Status
    description: Get MySQL database replication/cluster status
    parameter_descriptions:
      datasource_id: The database connection ID
    permission_descriptions:
      execute_query: Execute governed database queries
